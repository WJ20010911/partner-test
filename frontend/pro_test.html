<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pro 深度算法测试 - 伴侣匹配测试</title>
  <link rel="stylesheet" href="/css/style.css?v=2">
  <style>
    .nav-pro-btn {
      background: #2d2d2d !important;
      color: #fff !important;
      padding: 5px 14px !important;
      border-radius: 4px !important;
      font-weight: 600 !important;
      font-size: 0.85em !important;
    }
    .pro-badge {
      display: inline-block;
      background: #2d2d2d;
      color: #fff;
      padding: 2px 10px;
      border-radius: 10px;
      font-size: 0.75em;
      font-weight: 600;
      letter-spacing: 0.5px;
      margin-left: 8px;
      vertical-align: middle;
    }
    .result-radar {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 12px;
      margin: 16px 0;
    }
    .radar-item {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
      text-align: center;
    }
    .radar-item .label {
      font-size: 0.85em;
      color: var(--text-light);
      margin-bottom: 6px;
    }
    .radar-item .score {
      font-size: 1.8em;
      font-weight: 700;
      color: #2d2d2d;
    }
    .radar-item .bar-bg {
      height: 6px;
      background: #eee;
      border-radius: 3px;
      margin-top: 8px;
      overflow: hidden;
    }
    .radar-item .bar-fill {
      height: 100%;
      background: #2d2d2d;
      border-radius: 3px;
      transition: width 0.6s ease;
    }
    .result-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
      margin: 16px 0;
    }
    .result-meta .meta-item {
      background: #f5f5f5;
      border-radius: 8px;
      padding: 10px 18px;
      text-align: center;
      font-size: 0.9em;
    }
    .result-meta .meta-item .val {
      font-weight: 600;
      color: #2d2d2d;
    }
    .result-meta .meta-item .lbl {
      color: var(--text-light);
      font-size: 0.85em;
    }
    .verify-code {
      text-align: center;
      font-size: 0.85em;
      color: var(--text-light);
      margin-top: 12px;
      word-break: break-all;
    }
    .warning-box {
      background: #fff3cd;
      border: 1px solid #ffeeba;
      border-radius: 8px;
      padding: 12px 16px;
      margin: 12px 0;
      font-size: 0.9em;
      color: #856404;
    }
  </style>
</head>
<body>
  <nav class="nav">
    <a href="/index.html" class="nav-brand">伴侣匹配测试</a>
    <div class="nav-links">
      <a href="/index.html">首页</a>
      <a href="/login.html">上传题库</a>
    </div>
  </nav>

  <div class="container">
    <!-- Ready Screen -->
    <div id="start-screen" class="card" style="text-align:center;">
      <h2 style="color:var(--primary-dark);margin-bottom:16px;">
        准备好了吗？
        <span class="pro-badge">PRO</span>
      </h2>
      <p style="color:var(--text-light);margin-bottom:16px;">
        这是一次基于多维雷达图算法的<strong style="color:#2d2d2d;">深度行为分析测试</strong>。<br>
        题目与普通版不同，算法更复杂，结果更精准。
      </p>
      <div style="background:#f0f7ff;border:1px solid #d4e3f7;border-radius:8px;padding:12px 16px;margin-bottom:20px;text-align:left;font-size:13px;color:var(--text-color);line-height:1.6;">
        <strong>📖 操作说明</strong><br>
        · <strong>跳过</strong> — 这道题不适合你，换一道类似的题继续。<br>
        · <strong>投诉并跳过</strong> — 题目有问题或让你不适，标记后换一题。<br><br>
        ⚠ 注意：此模式使用独立题库和独立评分算法，结果不与普通版互通。
      </div>
      <button class="btn btn-primary" onclick="startProTest()">开始 Pro 深度测试</button>
    </div>

    <!-- Test Screen -->
    <div id="test-screen" class="hidden">
      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
          <span style="color:var(--text-light);font-size:0.9em;">第 <span id="q-num">1</span> / <span id="q-total">12</span> 题</span>
          <span style="color:var(--text-light);font-size:0.9em;" id="progress-pct">0%</span>
        </div>
        <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:0%;"></div></div>
        <div id="timer-bar-wrapper" style="height:4px;background:#eee;border-radius:2px;margin-bottom:8px;overflow:hidden;display:none;">
          <div id="timer-bar" style="height:100%;background:#e88d9e;width:100%;transition:width 1s linear;"></div>
        </div>
        <h3 id="q-content" style="font-size:1.2em;margin-bottom:20px;min-height:60px;"></h3>
        <ul class="options-list" id="options-list"></ul>
        <div style="display:flex;gap:8px;margin-top:16px;">
          <button class="btn btn-sm btn-outline" id="skip-btn" onclick="skipQuestion(false)" style="flex:1;font-size:0.85em;">跳过</button>
          <button class="btn btn-sm btn-outline" id="complain-btn" onclick="skipQuestion(true)" style="flex:1;font-size:0.85em;border-color:#e88d9e;color:#e88d9e;">投诉并跳过</button>
        </div>
      </div>
      <button class="btn btn-outline btn-block" id="next-btn" onclick="nextQuestion()" disabled>下一步</button>
    </div>

    <!-- Loading Screen -->
    <div id="loading-screen" class="hidden">
      <div class="spinner"></div>
      <p style="text-align:center;color:var(--text-light);">正在分析你的答案...</p>
    </div>

    <!-- Result Screen -->
    <div id="result-screen" class="hidden">
      <div class="card">
        <h2 style="color:var(--primary-dark);margin-bottom:8px;">Pro 深度评估结果</h2>
        <p style="color:var(--text-light);font-size:0.9em;margin-bottom:16px;">基于多维雷达图算法分析</p>
        <div id="result-content"></div>
      </div>
      <div style="text-align:center;margin-top:16px;">
        <a href="/index.html" class="btn btn-outline">返回首页</a>
      </div>
    </div>
  </div>

  <div class="footer">
    <p>伴侣匹配测试 &copy; 2026 · Pro 深度算法测试</p>
  </div>

  <script src="/js/api.js?v=2"></script>
  <script src="/js/utils.js?v=2"></script>
  <script>
    const PRO_API_BASE = 'https://partner-text-pro-production.up.railway.app';

    let proQuestions = [];
    let currentIdx = 0;
    let answers = [];
    let selectedOption = -1;
    let timerInterval = null;
    let timerRemaining = 0;
    let timerLimit = 0;
    const TARGET_ANSWER_COUNT = 12;
    let questionStartTime = 0;

    function completedAnswerCount() {
      return answers.filter(function(a) { return a.selectedIndex >= 0 || a.selectedIndex === -1; }).length;
    }

    function displayedQuestionIds() {
      return proQuestions.map(function(q) { return q.id; });
    }

    async function startProTest() {
      document.getElementById('start-screen').classList.add('hidden');
      document.getElementById('test-screen').classList.remove('hidden');

      try {
        const r = await fetch(PRO_API_BASE + '/api/match/questions?count=12');
        if (!r.ok) throw new Error('HTTP ' + r.status);
        const qs = await r.json();
        if (!Array.isArray(qs) || qs.length === 0) throw new Error('题库为空');

        proQuestions = qs;
        document.getElementById('q-total').textContent = TARGET_ANSWER_COUNT;
        renderQuestion();
      } catch (e) {
        alert('加载题目失败: ' + e.message + '\n\n请确认 Pro 后端服务已部署并运行。');
        document.getElementById('start-screen').classList.remove('hidden');
        document.getElementById('test-screen').classList.add('hidden');
      }
    }

    function clearTimer() {
      if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
      }
      document.getElementById('timer-bar-wrapper').style.display = 'none';
    }

    function handleTimeout() {
      clearTimer();
      answers.push({ questionId: proQuestions[currentIdx].id, selectedIndex: -1, timeTakenSeconds: timerLimit });
      currentIdx++;
      if (completedAnswerCount() >= TARGET_ANSWER_COUNT || currentIdx >= proQuestions.length) {
        submitProAnswers();
      } else {
        renderQuestion();
      }
    }

    function renderQuestion() {
      clearTimer();
      const q = proQuestions[currentIdx];
      const done = completedAnswerCount();
      document.getElementById('q-num').textContent = Math.min(done + 1, TARGET_ANSWER_COUNT);
      document.getElementById('q-content').textContent = q.content;
      const pct = (done / TARGET_ANSWER_COUNT * 100).toFixed(0);
      document.getElementById('progress-fill').style.width = pct + '%';
      document.getElementById('progress-pct').textContent = pct + '%';

      selectedOption = -1;
      questionStartTime = Date.now();

      const list = document.getElementById('options-list');
      list.innerHTML = '';

      q.options.forEach(function(opt, origIdx) {
        const li = document.createElement('li');
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.textContent = opt.text || '';
        btn.onclick = function() { selectOption(origIdx); };
        btn.dataset.index = origIdx;
        li.appendChild(btn);
        list.appendChild(li);
      });

      document.getElementById('next-btn').disabled = true;

      // Timer
      if (q.time_limit && q.time_limit > 0) {
        timerRemaining = q.time_limit;
        timerLimit = q.time_limit;
        const wrapper = document.getElementById('timer-bar-wrapper');
        const bar = document.getElementById('timer-bar');
        wrapper.style.display = 'block';
        bar.style.width = '100%';
        bar.style.transition = 'none';

        bar.offsetHeight;
        bar.style.transition = 'width 1s linear';

        timerInterval = setInterval(function() {
          timerRemaining--;
          const pct2 = (timerRemaining / timerLimit) * 100;
          bar.style.width = Math.max(0, pct2) + '%';
          if (timerRemaining <= 0) {
            clearInterval(timerInterval);
            timerInterval = null;
            handleTimeout();
          }
        }, 1000);
      }
    }

    function selectOption(idx) {
      selectedOption = idx;
      document.querySelectorAll('.option-btn').forEach(function(btn) {
        btn.classList.toggle('selected', parseInt(btn.dataset.index) === idx);
      });
      document.getElementById('next-btn').disabled = false;
    }

    async function fetchReplacementQuestion() {
      const exclude = encodeURIComponent(displayedQuestionIds().join(','));
      const r = await fetch(PRO_API_BASE + '/api/match/questions/replacement?exclude=' + exclude);
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return await r.json();
    }

    async function skipQuestion(isComplaint) {
      clearTimer();
      const timeTaken = (Date.now() - questionStartTime) / 1000;
      var qid = proQuestions[currentIdx].id;
      answers.push({
        questionId: qid,
        selectedIndex: isComplaint ? -3 : -2,
        timeTakenSeconds: timeTaken
      });

      if (isComplaint) {
        // Also record the complaint to the local server
        fetch('/api/test/skip', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ question_id: qid, reason: 'complaint', source: 'pro' })
        }).catch(function(e) {});
      }

      try {
        const replacement = await fetchReplacementQuestion();
        proQuestions.push(replacement);
      } catch (e) {
        alert('换题失败: ' + e.message);
        return;
      }

      currentIdx++;
      renderQuestion();
    }

    function nextQuestion() {
      if (selectedOption < 0) return;
      clearTimer();
      const timeTaken = (Date.now() - questionStartTime) / 1000;
      answers.push({
        questionId: proQuestions[currentIdx].id,
        selectedIndex: selectedOption,
        timeTakenSeconds: timeTaken
      });
      currentIdx++;
      if (completedAnswerCount() >= TARGET_ANSWER_COUNT) {
        submitProAnswers();
      } else {
        renderQuestion();
      }
    }

    async function submitProAnswers() {
      document.getElementById('test-screen').classList.add('hidden');
      document.getElementById('loading-screen').classList.remove('hidden');

      // Try external API first to get radar scores
      var externalResult = null;
      var externalError = null;
      try {
        const r = await fetch(PRO_API_BASE + '/api/match/submit', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ answers: answers })
        });
        if (!r.ok) {
          const errText = await r.text();
          throw new Error(errText || 'HTTP ' + r.status);
        }
        externalResult = await r.json();
      } catch (e) {
        externalError = e.message;
      }

      // Calculate: 4-dimension sum (rounded) and penalty (rounded), kept separate
      var totalPenalty = externalResult ? Math.round((externalResult.totalPenalty || 0) * 100) / 100 : 0;
      var radarScoreSum = 0;
      if (externalResult) {
        Object.values(externalResult.radarScores || {}).forEach(function(v) { radarScoreSum += Math.round(v * 100) / 100; });
      }
      radarScoreSum = Math.round(radarScoreSum * 100) / 100;
      var finalScore = radarScoreSum;  // 四维总分，不含扣分
      var surfaceScore = Math.max(0, Math.round((100 - (radarScoreSum + totalPenalty)) * 10) / 10);

      // Submit to local server once, with correct scores
      var localToken = null;
      try {
        const localR = await fetch('/api/test/pro-submit', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            answers: answers,
            real_score: finalScore,
            surface_score: surfaceScore
          })
        });
        if (localR.ok) {
          const localResult = await localR.json();
          localToken = localResult.real_token;
        }
      } catch(e) {}

      document.getElementById('loading-screen').classList.add('hidden');

      var result = externalResult || {};
      result.localToken = localToken;
      result.finalScore = finalScore;
      result.totalPenalty = totalPenalty;
      result.radarScoreSum = radarScoreSum;
      result.surfaceScore = surfaceScore;
      result.isFlagged = externalResult ? externalResult.isFlagged : false;

      if (externalResult) {
        renderProResult(result);
      } else {
        result.radarScores = {};
        result.totalPenalty = 0;
        result.radarScoreSum = 0;
        result.isFlagged = false;
        renderProResult(result, externalError);
      }
    }

    function renderProResult(result, externalError) {
      document.getElementById('result-screen').classList.remove('hidden');

      let html = '';
      var radar = result.radarScores || {};

      // First row: 4 dimension scores with color
      var dims = [
        { key: 'Friction',     label: '摩擦' },
        { key: 'Reality',      label: '现实' },
        { key: 'Empathy',      label: '共情' },
        { key: 'CommonSense',  label: '常识' }
      ];
      html += '<div style="background:#f8f9fa;border-radius:12px;padding:20px;text-align:center;margin-bottom:12px;">';
      html += '<div style="display:flex;justify-content:center;gap:24px;flex-wrap:wrap;">';
      dims.forEach(function(d) {
        var score = radar[d.key];
        var val;
        if (score == null) { val = '-'; } else { val = Math.round(score * 100) / 100; }
        var color;
        if (typeof val === 'number') {
          if (val < 10) color = '#f0ad4e';
          else if (val <= 25) color = '#28a745';
          else color = '#c62828';
        } else {
          color = '#999';
        }
        html += '<div>';
        html += '<div style="font-size:0.75em;color:#888;margin-bottom:2px;">' + d.label + '</div>';
        html += '<div style="font-size:2em;font-weight:700;color:' + color + ';">' + val + '</div>';
        html += '</div>';
      });
      html += '</div>';
      html += '</div>';

      // Second row: total score + penalty
      html += '<div style="background:#f8f9fa;border-radius:12px;padding:16px;text-align:center;margin-bottom:20px;">';
      html += '<div style="display:flex;justify-content:center;gap:40px;flex-wrap:wrap;">';
      html += '<div><div style="font-size:1.6em;font-weight:700;color:#2d2d2d;">' + (result.finalScore != null ? result.finalScore.toFixed(1) : '0.0') + '</div>';
      html += '<div style="font-size:0.75em;color:#888;margin-top:2px;">四维总分</div></div>';
      html += '<div><div style="font-size:1.6em;font-weight:700;color:#e88d9e;">' + (result.totalPenalty || 0).toFixed(1) + '</div>';
      html += '<div style="font-size:0.75em;color:#888;margin-top:2px;">扣分</div></div>';
      html += '</div>';
      html += '</div>';

      // Verify code card
      if (result.localToken) {
        html += '<div style="background:#ffffff;border:1px solid #e0e0e0;border-radius:10px;padding:16px;">';
        html += '<div style="font-size:0.85em;color:#888;margin-bottom:8px;">验真码</div>';
        html += '<div style="display:flex;align-items:center;gap:10px;">';
        html += '<code id="local-token" style="flex:1;background:#f5f5f5;padding:8px 12px;border-radius:6px;font-size:13px;word-break:break-all;font-family:monospace;color:#333;">' + escapeHtml(result.localToken) + '</code>';
        html += '<button onclick="copyToken()" style="border:none;background:#2d2d2d;color:#fff;padding:8px 16px;border-radius:6px;cursor:pointer;font-size:0.85em;white-space:nowrap;">复制</button>';
        html += '</div>';
        html += '<div style="margin-top:12px;text-align:center;">';
        html += '<a href="/verify.html" class="btn btn-sm btn-outline" target="_blank">去验真</a>';
        html += '</div>';
        html += '</div>';
      }

      document.getElementById('result-content').innerHTML = html;
    }

    function copyToken() {
      var token = document.getElementById('local-token').textContent;
      navigator.clipboard.writeText(token).then(function() {
        var btn = event.target;
        var orig = btn.textContent;
        btn.textContent = '已复制';
        btn.style.background = '#28a745';
        setTimeout(function() { btn.textContent = orig; btn.style.background = '#2d2d2d'; }, 1500);
      });
    }

    function escapeHtml(str) {
      if (!str) return '';
      var div = document.createElement('div');
      div.appendChild(document.createTextNode(str));
      return div.innerHTML.replace(/"/g, '&quot;');
    }
  </script>
</body>
</html>
