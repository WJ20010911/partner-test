<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pro 深度算法测试 - 伴侣匹配测试</title>
  <link rel="stylesheet" href="/css/style.css?v=4">
  <script src="/js/theme.js?v=1"></script>
  <style>
    .pro-badge {
      display: inline-block;
      background: var(--pro-gradient);
      color: #fff;
      padding: 3px 12px;
      border-radius: 12px;
      font-size: 0.75em;
      font-weight: 700;
      letter-spacing: 0.6px;
      margin-left: 8px;
      vertical-align: middle;
    }
    .result-radar {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 12px;
      margin: 16px 0;
    }
    .radar-item {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 18px;
      text-align: center;
      box-shadow: var(--shadow-sm);
    }
    .radar-item .label {
      font-size: 0.85em;
      color: var(--text-light);
      margin-bottom: 6px;
    }
    .radar-item .score {
      font-size: 1.8em;
      font-weight: 700;
      color: var(--rose-gold);
    }
    .radar-item .bar-bg {
      height: 6px;
      background: var(--primary-soft);
      border-radius: 3px;
      margin-top: 8px;
      overflow: hidden;
    }
    .radar-item .bar-fill {
      height: 100%;
      background: var(--pro-gradient);
      border-radius: 3px;
      transition: width 0.6s ease;
    }
    .result-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
      margin: 16px 0;
    }
    .result-meta .meta-item {
      background: var(--bg);
      border-radius: 12px;
      padding: 14px 22px;
      text-align: center;
      font-size: 0.9em;
      border: 1px solid var(--border);
    }
    .result-meta .meta-item .val {
      font-weight: 700;
      font-size: 1.3em;
      color: var(--rose-gold);
    }
    .result-meta .meta-item .lbl {
      color: var(--text-light);
      font-size: 0.85em;
    }
    .verify-code {
      text-align: center;
      font-size: 0.85em;
      color: var(--text-light);
      margin-top: 12px;
      word-break: break-all;
    }
    .warning-box {
      background: #fff3cd;
      border: 1px solid #ffeeba;
      border-radius: 10px;
      padding: 14px 18px;
      margin: 12px 0;
      font-size: 0.9em;
      color: #856404;
    }
    .option-btn {
      display: block; width: 100%; text-align: left; padding: 15px 20px;
      margin-bottom: 10px; border: 2px solid var(--border); border-radius: 12px;
      background: var(--bg-card); color: var(--text); font-size: 1em;
      cursor: pointer; transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .option-btn:hover { border-color: var(--primary-light); background: var(--primary-soft); transform: scale(1.01); }
    .option-btn.selected { border-color: var(--primary); background: linear-gradient(135deg, #ffe0e6, #fff0f3); color: var(--primary-dark); font-weight: 600; box-shadow: 0 2px 14px rgba(255,107,129,0.15); transform: scale(1.01); }
  </style>
</head>
<body>
  <nav class="nav">
    <a href="/index.html" class="nav-brand">伴侣匹配测试</a>
    <div class="nav-links">
      <a href="/index.html">首页</a>
      <a href="/login.html">上传题库</a>
    </div>
  </nav>

  <div class="container">
    <!-- Ready Screen -->
    <div id="start-screen" class="card" style="text-align:center;padding:48px 28px;">
      <div style="font-size:3em;margin-bottom:12px;">🔬</div>
      <h2 style="color:var(--rose-gold);margin-bottom:12px;">
        深度算法测试
        <span class="pro-badge">PRO</span>
      </h2>
      <p style="color:var(--text-light);margin-bottom:20px;">
        基于<strong style="color:var(--rose-gold);">多维雷达图算法</strong>的深度行为分析。<br>
        包含伪装检测、犹豫度分析、ROI 陷阱，结果更精准。
      </p>
      <div style="background:linear-gradient(135deg,#fff0f3,#fff5f7);border:1px solid var(--border);border-radius:var(--radius-md);padding:16px 20px;margin-bottom:24px;text-align:left;font-size:0.9em;color:var(--text);line-height:1.7;">
        <strong style="color:var(--rose-gold);">📖 操作说明</strong><br>
        · <strong>跳过</strong> — 这道题不适合你，换一道类似的题继续。<br>
        · <strong>投诉并跳过</strong> — 题目有问题或让你不适，标记后换一题。<br><br>
        ⚠ 此模式使用<strong>独立题库</strong>和<strong>独立评分算法</strong>，结果不与普通版互通。
      </div>
      <button class="btn btn-primary btn-pulse" onclick="startProTest()" style="font-size:1.08em;padding:14px 40px;background:var(--pro-gradient);">开始 Pro 深度测试</button>
    </div>

    <!-- Test Screen -->
    <div id="test-screen" class="hidden">
      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
          <span style="color:var(--text-light);font-size:0.9em;">第 <span id="q-num" style="color:var(--rose-gold);font-weight:600;">1</span> / <span id="q-total">12</span> 题</span>
          <span style="color:var(--text-light);font-size:0.9em;" id="progress-pct">0%</span>
        </div>
        <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:0%;background:var(--pro-gradient);"></div></div>
        <div id="timer-bar-wrapper" style="height:4px;background:var(--primary-soft);border-radius:2px;margin-bottom:8px;overflow:hidden;display:none;">
          <div id="timer-bar" style="height:100%;background:linear-gradient(90deg,var(--primary-light),#e88d9e);width:100%;transition:width 1s linear;"></div>
        </div>
        <h3 id="q-content" style="font-size:1.2em;margin-bottom:20px;min-height:60px;line-height:1.8;"></h3>
        <ul class="options-list" id="options-list"></ul>
        <div class="action-row">
          <button class="btn btn-outline btn-sm" id="skip-btn" onclick="skipQuestion(false)">跳过</button>
          <button class="btn btn-outline btn-sm" id="complain-btn" onclick="skipQuestion(true)" style="border-color:#e88d9e;color:#e88d9e;">投诉并跳过</button>
          <button class="btn btn-primary" id="next-btn" onclick="nextQuestion()" disabled>下一题</button>
        </div>
      </div>
    </div>

    <!-- Loading Screen -->
    <div id="loading-screen" class="hidden">
      <div class="spinner"></div>
      <p style="text-align:center;color:var(--text-light);margin-top:16px;">正在分析你的答案...</p>
    </div>

    <!-- Result Screen -->
    <div id="result-screen" class="hidden">
      <div class="card" style="padding:32px;">
        <h2 style="color:var(--rose-gold);margin-bottom:6px;text-align:center;">Pro 深度评估结果</h2>
        <p style="color:var(--text-light);font-size:0.9em;margin-bottom:20px;text-align:center;">基于多维雷达图算法分析</p>
        <div id="result-content"></div>
      </div>
      <div style="text-align:center;margin-top:20px;display:flex;gap:12px;justify-content:center;">
        <a href="/index.html" class="btn btn-outline">返回首页</a>
        <a href="/pro_test.html" class="btn btn-primary" style="background:var(--pro-gradient);">再测一次</a>
      </div>
    </div>
  </div>

  <div class="footer">
    <div id="theme-palette" style="margin-bottom:10px;"></div>
    <p>伴侣匹配测试 &copy; 2026 · Pro 深度算法测试</p>
  </div>

  <script src="/js/theme.js?v=1"></script>
  <script src="/js/api.js?v=3"></script>
  <script src="/js/utils.js?v=2"></script>
  <script>
    const PRO_API_BASE = 'https://partner-text-pro-production.up.railway.app';

    let proQuestions = [];
    let currentIdx = 0;
    let answers = [];
    let selectedOption = -1;
    let timerInterval = null;
    let timerRemaining = 0;
    let timerLimit = 0;
    const TARGET_ANSWER_COUNT = 12;
    let questionStartTime = 0;

    function completedAnswerCount() {
      return answers.filter(function(a) { return a.selectedIndex >= 0 || a.selectedIndex === -1; }).length;
    }

    function displayedQuestionIds() {
      return proQuestions.map(function(q) { return q.id; });
    }

    async function startProTest() {
      document.getElementById('start-screen').classList.add('hidden');
      document.getElementById('test-screen').classList.remove('hidden');

      try {
        const r = await fetch(PRO_API_BASE + '/api/match/questions?count=12');
        if (!r.ok) throw new Error('HTTP ' + r.status);
        const qs = await r.json();
        if (!Array.isArray(qs) || qs.length === 0) throw new Error('题库为空');

        proQuestions = qs;
        document.getElementById('q-total').textContent = TARGET_ANSWER_COUNT;
        renderQuestion();
      } catch (e) {
        alert('加载题目失败: ' + e.message + '\n\n请确认 Pro 后端服务已部署并运行。');
        document.getElementById('start-screen').classList.remove('hidden');
        document.getElementById('test-screen').classList.add('hidden');
      }
    }

    function clearTimer() {
      if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
      }
      document.getElementById('timer-bar-wrapper').style.display = 'none';
    }

    function handleTimeout() {
      clearTimer();
      answers.push({ questionId: proQuestions[currentIdx].id, selectedIndex: -1, timeTakenSeconds: timerLimit });
      currentIdx++;
      if (completedAnswerCount() >= TARGET_ANSWER_COUNT || currentIdx >= proQuestions.length) {
        submitProAnswers();
      } else {
        renderQuestion();
      }
    }

    function renderQuestion() {
      clearTimer();
      const q = proQuestions[currentIdx];
      const done = completedAnswerCount();
      document.getElementById('q-num').textContent = Math.min(done + 1, TARGET_ANSWER_COUNT);
      document.getElementById('q-content').textContent = q.content;
      const pct = (done / TARGET_ANSWER_COUNT * 100).toFixed(0);
      document.getElementById('progress-fill').style.width = pct + '%';
      document.getElementById('progress-pct').textContent = pct + '%';

      selectedOption = -1;
      questionStartTime = Date.now();

      const list = document.getElementById('options-list');
      list.innerHTML = '';

      q.options.forEach(function(opt, origIdx) {
        const li = document.createElement('li');
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.textContent = opt.text || '';
        btn.onclick = function() { selectOption(origIdx); };
        btn.dataset.index = origIdx;
        li.appendChild(btn);
        list.appendChild(li);
      });

      document.getElementById('next-btn').disabled = true;

      // Timer
      if (q.time_limit && q.time_limit > 0) {
        timerRemaining = q.time_limit;
        timerLimit = q.time_limit;
        const wrapper = document.getElementById('timer-bar-wrapper');
        const bar = document.getElementById('timer-bar');
        wrapper.style.display = 'block';
        bar.style.width = '100%';
        bar.style.transition = 'none';
        bar.offsetHeight;
        bar.style.transition = 'width 1s linear';

        timerInterval = setInterval(function() {
          timerRemaining--;
          const pct2 = (timerRemaining / timerLimit) * 100;
          bar.style.width = Math.max(0, pct2) + '%';
          if (timerRemaining <= 0) {
            clearInterval(timerInterval);
            timerInterval = null;
            handleTimeout();
          }
        }, 1000);
      }
    }

    function selectOption(idx) {
      selectedOption = idx;
      document.querySelectorAll('.option-btn').forEach(function(btn) {
        btn.classList.toggle('selected', parseInt(btn.dataset.index) === idx);
      });
      document.getElementById('next-btn').disabled = false;
    }

    async function fetchReplacementQuestion() {
      const exclude = encodeURIComponent(displayedQuestionIds().join(','));
      const r = await fetch(PRO_API_BASE + '/api/match/questions/replacement?exclude=' + exclude);
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return await r.json();
    }

    async function skipQuestion(isComplaint) {
      clearTimer();
      const timeTaken = (Date.now() - questionStartTime) / 1000;
      var qid = proQuestions[currentIdx].id;
      answers.push({
        questionId: qid,
        selectedIndex: isComplaint ? -3 : -2,
        timeTakenSeconds: timeTaken
      });

      if (isComplaint) {
        fetch('/api/test/skip', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ question_id: qid, reason: 'complaint', source: 'pro' })
        }).catch(function(e) {});
      }

      try {
        const replacement = await fetchReplacementQuestion();
        proQuestions.push(replacement);
      } catch (e) {
        alert('换题失败: ' + e.message);
        return;
      }

      currentIdx++;
      renderQuestion();
    }

    function nextQuestion() {
      if (selectedOption < 0) return;
      clearTimer();
      const timeTaken = (Date.now() - questionStartTime) / 1000;
      answers.push({
        questionId: proQuestions[currentIdx].id,
        selectedIndex: selectedOption,
        timeTakenSeconds: timeTaken
      });
      currentIdx++;
      if (completedAnswerCount() >= TARGET_ANSWER_COUNT) {
        submitProAnswers();
      } else {
        renderQuestion();
      }
    }

    async function submitProAnswers() {
      document.getElementById('test-screen').classList.add('hidden');
      document.getElementById('loading-screen').classList.remove('hidden');

      var externalResult = null;
      var externalError = null;
      try {
        const r = await fetch(PRO_API_BASE + '/api/match/submit', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ answers: answers })
        });
        if (!r.ok) {
          const errText = await r.text();
          throw new Error(errText || 'HTTP ' + r.status);
        }
        externalResult = await r.json();
      } catch (e) {
        externalError = e.message;
      }

      var totalPenalty = externalResult ? Math.round((externalResult.totalPenalty || 0) * 100) / 100 : 0;
      var radarScoreSum = 0;
      if (externalResult) {
        Object.values(externalResult.radarScores || {}).forEach(function(v) { radarScoreSum += Math.round(v * 100) / 100; });
      }
      radarScoreSum = Math.round(radarScoreSum * 100) / 100;
      var finalScore = radarScoreSum;
      var surfaceScore = Math.max(0, Math.round((100 - (radarScoreSum + totalPenalty)) * 10) / 10);

      var localToken = null;
      try {
        const localR = await fetch('/api/test/pro-submit', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            answers: answers,
            real_score: finalScore,
            surface_score: surfaceScore
          })
        });
        if (localR.ok) {
          const localResult = await localR.json();
          localToken = localResult.real_token;
        }
      } catch(e) {}

      document.getElementById('loading-screen').classList.add('hidden');

      var result = externalResult || {};
      result.localToken = localToken;
      result.finalScore = finalScore;
      result.totalPenalty = totalPenalty;
      result.radarScoreSum = radarScoreSum;
      result.surfaceScore = surfaceScore;
      result.isFlagged = externalResult ? externalResult.isFlagged : false;

      if (externalResult) {
        renderProResult(result);
      } else {
        result.radarScores = {};
        result.totalPenalty = 0;
        result.radarScoreSum = 0;
        result.isFlagged = false;
        renderProResult(result, externalError);
      }
    }

    function renderProResult(result, externalError) {
      document.getElementById('result-screen').classList.remove('hidden');

      let html = '';
      var radar = result.radarScores || {};

      // Four dimension scores
      var dims = [
        { key: 'Friction',     label: '摩擦',  emoji: '⚡' },
        { key: 'Reality',      label: '现实',  emoji: '🌍' },
        { key: 'Empathy',      label: '共情',  emoji: '💗' },
        { key: 'CommonSense',  label: '常识',  emoji: '🧠' }
      ];

      html += '<div style="background:linear-gradient(135deg,var(--bg-warm),var(--bg));border-radius:var(--radius-md);padding:24px;text-align:center;margin-bottom:16px;">';
      html += '<div style="display:flex;justify-content:center;gap:28px;flex-wrap:wrap;">';
      dims.forEach(function(d) {
        var score = radar[d.key];
        var val = (score != null) ? Math.round(score * 100) / 100 : '-';
        var color;
        if (typeof val === 'number') {
          if (val < 10) color = '#f0ad4e';
          else if (val <= 25) color = '#28a745';
          else color = '#c62828';
        } else {
          color = '#999';
        }
        html += '<div style="min-width:70px;">';
        html += '<div style="font-size:1.3em;margin-bottom:4px;">' + d.emoji + '</div>';
        html += '<div style="font-size:0.75em;color:#888;margin-bottom:4px;">' + d.label + '</div>';
        html += '<div style="font-size:2em;font-weight:700;color:' + color + ';">' + val + '</div>';
        html += '</div>';
      });
      html += '</div>';
      html += '</div>';

      // Total scores
      html += '<div style="background:linear-gradient(135deg,var(--bg-warm),var(--bg));border-radius:var(--radius-md);padding:20px;text-align:center;margin-bottom:20px;">';
      html += '<div style="display:flex;justify-content:center;gap:40px;flex-wrap:wrap;">';
      html += '<div><div style="font-size:1.8em;font-weight:700;color:var(--rose-gold);">' + (result.finalScore != null ? result.finalScore.toFixed(1) : '0.0') + '</div>';
      html += '<div style="font-size:0.8em;color:#888;margin-top:4px;">四维总分</div></div>';
      html += '<div><div style="font-size:1.8em;font-weight:700;color:#e88d9e;">' + (result.totalPenalty || 0).toFixed(1) + '</div>';
      html += '<div style="font-size:0.8em;color:#888;margin-top:4px;">扣分</div></div>';
      html += '</div>';
      html += '</div>';

      // Verify code
      if (result.localToken) {
        html += '<div style="background:#fff;border:1px solid var(--border);border-radius:var(--radius-md);padding:20px;">';
        html += '<div style="font-size:0.85em;color:var(--text-muted);margin-bottom:10px;text-align:center;">验真码</div>';
        html += '<div style="display:flex;align-items:center;gap:10px;">';
        html += '<code id="local-token" style="flex:1;background:var(--bg);padding:10px 14px;border-radius:10px;font-size:13px;word-break:break-all;font-family:monospace;color:var(--text);border:1px solid var(--border);">' + escapeHtml(result.localToken) + '</code>';
        html += '<button onclick="copyToken()" style="border:none;background:var(--pro-gradient);color:#fff;padding:10px 18px;border-radius:24px;cursor:pointer;font-size:0.85em;white-space:nowrap;font-weight:600;">复制</button>';
        html += '</div>';
        html += '<div style="margin-top:14px;text-align:center;">';
        html += '<a href="/verify.html" class="btn btn-sm btn-outline" target="_blank">去验真</a>';
        html += '</div>';
        html += '</div>';
      }

      // Warning
      if (result.isFlagged) {
        html = '<div class="warning-box" style="margin-bottom:16px;">⚠ 检测到异常答题模式，可能影响结果准确性</div>' + html;
      }

      document.getElementById('result-content').innerHTML = html;
    }

    function copyToken() {
      var token = document.getElementById('local-token').textContent;
      navigator.clipboard.writeText(token).then(function() {
        var btn = event.target;
        var orig = btn.textContent;
        btn.textContent = '已复制';
        btn.style.background = '#28a745';
        setTimeout(function() { btn.textContent = orig; btn.style.background = ''; }, 1500);
      });
    }

    function escapeHtml(str) {
      if (!str) return '';
      var div = document.createElement('div');
      div.appendChild(document.createTextNode(str));
      return div.innerHTML.replace(/"/g, '&quot;');
    }

    Theme.renderPalette(document.getElementById('theme-palette'));
  </script>
</body>
</html>
